; Konfiguracja wtyczki BeamDash – plik musi leżeć obok beamdash_telemetry.dll
; (bin\win_x64\plugins\). Po zmianie: restart gry albo w konsoli gry "sdk reinit".

; IP wyświetlacza (pokazuje go ekran "Czekam na dane z gry").
; 255.255.255.255 = broadcast do całej sieci lokalnej – działa bez wpisywania IP,
; ale stały adres ESP32 jest pewniejszy (WiFi gubi więcej pakietów broadcast).
ip=255.255.255.255

; port UDP – taki sam jak OutGauge w BeamNG, ESP32 rozpozna grę po treści pakietu
port=4444

; ile pakietów na sekundę (1..100)
rate=30
