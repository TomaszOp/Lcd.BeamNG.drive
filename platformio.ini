[platformio]
default_envs = esp32s3

; wspólne ustawienia dla wszystkich płytek
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
; config.h dołączany do każdego pliku (także do TFT_eSPI) – tam są piny,
; zestaw pinów wybiera flaga BOARD_* z danego środowiska
build_flags =
    -include $PROJECT_INCLUDE_DIR/config.h

; ESP32-S3 (4D Systems gen4, 8 MB PSRAM, 16 MB flash) – domyślna
[env:esp32s3]
board = 4d_systems_esp32s3_gen4_r8n16
upload_port = /dev/esp32
monitor_port = /dev/esp32  
build_flags =
    ${env.build_flags}
    -D BOARD_ESP32S3

; ESP32-S3 – wgrywanie przez WiFi (OTA_ENABLE 1 w config.h, pierwszy raz trzeba przez USB):
;   pio run -e esp32s3_ota -t upload
; upload_port: nazwa z OTA_HOSTNAME (mDNS) albo stały IP urządzenia (pewniejszy, gdy .local nie działa)
[env:esp32s3_ota]
extends = env:esp32s3
upload_protocol = espota
upload_port = beamng-dash.local
upload_flags =
    --auth=BeamNG

; ESP32 WROOM-32 (klasyczny ESP32 DevKit)
[env:esp32dev]
board = esp32dev
; 4 MB flash: domyślne partycje dają tylko 1,25 MB na program; min_spiffs = 2 x 1,9 MB
; (dwie partycje aplikacji są potrzebne do OTA – huge_app.csv ma jedną i OTA nie zadziała)
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -D BOARD_ESP32_WROOM

; ESP32 WROOM – wgrywanie przez WiFi (jak esp32s3_ota):
;   pio run -e esp32dev_ota -t upload
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = beamng-dash.local
upload_flags =
    --auth=BeamNG

; ESP32-C3 – brak zestawu pinów w config.h
[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1
